{% set version = "1.2.4" %}

package:
  name: pylabdd
  version: {{ version }}

source:
  #url: https://pypi.org/packages/source/p/pylabdd/pylabdd-{{ version }}.tar.gz
  #sha256: 15cab637fd6ec6c8f5aa0f54b32eb84dc1143357096e045448b1bcbe136c5953
  git_url: https://github.com/AHartmaier/pyLabDD.git  # temporary change for test purposes
  git_rev: main
  
build:
  number: 0
  skip: true  # [py>=311]
  skip: true  # [win]
  skip: true  # [linux]
  script: |
    export LIBRARY_PATH="{{ PREFIX }}/lib:${LIBRARY_PATH}"
    export DYLD_LIBRARY_PATH="{{ PREFIX }}/lib:${DYLD_LIBRARY_PATH}"
    echo "***FFLAGS=$FFLAGS"
    echo "***LDFLAGS=$LDFLAGS"
    echo "***LIBRARY_PATH=$LIBRARY_PATH"
    echo "BUILD_PREFIX libs"
    ls -l {{ BUILD_PREFIX }}/lib | grep gfortran || true
    echo "PREFIX libs"
    ls -l {{ PREFIX }}/lib | grep gfortran || true
    {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    echo "*** Files in build/lib/pylabdd/PK_force/"
    ls -l build/lib/pylabdd/PK_force/
    echo "*** Files in site-packages"
    ls -l {{ SP_DIR }}/pylabdd/PK_force/*.so
    file {{ SP_DIR }}/pylabdd/PK_force/PK_force.arm64.so

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - libgfortran5                           # [build_platform != target_platform]
    - {{ compiler('fortran') }}  # [not win]
    - {{ compiler('m2w64_fortran') }}  # [win]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - numpy
    - libgfortran5
    - fmodpy
  run:
    - python
    - numpy
    - matplotlib-base
    - fmodpy

test:
  requires:
    - pip
  imports:
    - pylabdd
  commands:
    - pip check

about:
  home: https://github.com/AHartmaier/pyLabDD
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: "Python Laboratory for Dislocation Dynamics"
  description: |
    pylabdd provides tools for dislocation dynamics simulations in Python,
    including Fortran-accelerated routines via fmodpy.
  dev_url: https://github.com/AHartmaier/pyLabDD

extra:
  recipe-maintainers:
    - AHartmaier
